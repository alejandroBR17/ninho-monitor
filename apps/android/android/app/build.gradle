plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.jortanviewer.jortan_viewer'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.jortanviewer.jortan_viewer'
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        ndk { abiFilters 'arm64-v8a' }
    }
    packaging {
        jniLibs {
            // Some plugins bundle extra ABIs; only arm64 has our Flutter engine.
            excludes += ['**/armeabi-v7a/*.so', '**/x86/*.so', '**/x86_64/*.so']
        }
    }
    buildTypes {
        release {
            // Personal release distribution keeps the installed certificate for updates.
            // Store publication would need a separate signing/migration plan.
            signingConfig signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter { source '../..' }
