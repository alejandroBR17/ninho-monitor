logLevel: warn
rtsp: yes
rtspAddress: :8554
rtspTransports: [udp, tcp]
rtpAddress: :8000
rtcpAddress: :8001
rtmp: no
hls: no
webrtc: no
srt: no
moq: no
authMethod: internal
authInternalUsers:
  - user: publisher
    pass: publish-only
    ips: [127.0.0.1]
    permissions:
      - action: publish
        path: onvif1
      - action: publish
        path: onvif2
  - user: viewer
    pass: test-only
    ips: []
    permissions:
      - action: read
paths:
  onvif1:
    source: publisher
  onvif2:
    source: publisher
